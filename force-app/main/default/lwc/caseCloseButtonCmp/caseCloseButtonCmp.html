<template>
    <lightning-quick-action-panel header="Update Case Status">
        <lightning-record-edit-form
            record-id={recordId} object-api-name={objectApiName} onsubmit ={handleSubmit}>
        <lightning-input-field field-name="Status"></lightning-input-field>
        <div class="slds-var-m-top_medium">
            <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
            <lightning-button variant="brand" class="slds-m-left_x-small" label="Save" type="submit">
            </lightning-button>
        </div>
        </lightning-record-edit-form>        
    </lightning-quick-action-panel>
</template>
