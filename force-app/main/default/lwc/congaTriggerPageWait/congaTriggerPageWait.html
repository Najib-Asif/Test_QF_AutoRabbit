<template>
    <div class="slds-grid slds-media_center">
        <template if:true={showSpinner}>
            <div class="slds-text-align_center">Document Generation was In Progress</div>
            <lightning-spinner  alternative-text="Loading" size="medium"></lightning-spinner>
        </template>
        <template if:false={showSpinner}>
            <span>Latest Attachment Name: </span> <lightning-button variant="base" label={fileName} onclick={handleRelationshipRecords} class="slds-m-around_small"></lightning-button>
        </template>
    </div>
    
    
</template>
