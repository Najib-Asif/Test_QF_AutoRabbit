<template>
	<lightning-layout>
		<lightning-layout-item size="12">
			<div class="slds-grid ">
			<lightning-combobox read-only={accessLevel} name="checklistType" label="Checklist" value={value}
				placeholder="Select a checklist type" options={options} onchange={handleChange} class="slds-size_10-of-12 slds-m-right_small  slds-text-align_left">
			</lightning-combobox>
			
                <lightning-button variant="destructive" label="Add" onclick={handleButtonClick} class="slds-size_1-of-12 slds-m-top_large slds-text-align_left"></lightning-button>
            </div>
		</lightning-layout-item>
	</lightning-layout>  
</template>
