<template>
    <template if:true={passengers}>
        <lightning-datatable
            key-field="id"
            data={passengers}
            columns={columns}
            wrap-text-max-lines="3"
            selected-rows="0"
            hide-checkbox-column="true">
        </lightning-datatable>
    </template>
    <template if:false={passengers}>
        No contact data available
    </template>
</template>
