<template>
    <div class="spinnerStyle">
    <div class="slds-align_absolute-center slds-p-bottom_large" style="font-size:20px;">
        Create Variation / Renewal
    </div>
    <div class="slds-box">
        
            <lightning-layout horizontal-align="spread" class="slds-p-around_x-small">
                <lightning-layout-item>
                    <div style="font-size:14px;">Change of Discount and Special Conditions</div>
                </lightning-layout-item>
                <lightning-layout-item>
                    <lightning-input type="toggle" message-toggle-active="" message-toggle-inactive="" label="" value="discountSpecialCondition" onchange={handleChange}></lightning-input>
                </lightning-layout-item>
            </lightning-layout>
         
        <lightning-layout horizontal-align="spread" class="slds-p-around_x-small">
            <lightning-layout-item>
                <div style="font-size:14px;">Renew Contract</div>
            </lightning-layout-item>
            <lightning-layout-item>
                <lightning-input type="toggle" message-toggle-active="" message-toggle-inactive="" label="" value="renewal" onchange={handleChange}></lightning-input>
            </lightning-layout-item>
        </lightning-layout>
    </div>
    <div class="slds-align_absolute-center slds-p-top_large">
        <div class="slds-p-right_small">
            <lightning-button label="Submit" onclick={handleSubmit}></lightning-button>
        </div>
        <div>
            <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
        </div>
    </div>
    <template if:true={loaded}>
        <lightning-spinner alternative-text="Loading"></lightning-spinner>
    </template>
    </div>
</template>
